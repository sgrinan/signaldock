name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"

  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
      - "docs/**"

jobs:
  go:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check
        run: make ci

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t signaldock:ci .

  helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint Helm chart
        run: helm lint deploy/helm/signaldock

      - name: Render Helm chart
        run: helm template signaldock deploy/helm/signaldock > /tmp/signaldock.yaml

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Create test namespaces
        run: |
          kubectl create namespace signaldock-ci
          kubectl apply -f deploy/kubernetes/namespace.yaml

      - name: Validate Helm manifests
        run: kubectl apply --dry-run=server -n signaldock-ci -f /tmp/signaldock.yaml

      - name: Validate raw Kubernetes manifests
        run: kubectl apply --dry-run=server --recursive -f deploy/kubernetes
  
  publish:
    needs:
      - go
      - docker
      - helm

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}