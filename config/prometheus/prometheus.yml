global:
  scrape_interval: 5s

scrape_configs:
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]

    http_sd_configs:
      - url: http://signaldock:8080/api/prometheus/targets
        refresh_interval: 5s

    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox:9115