<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users · SignalDock</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="container">
        <h1>Users</h1>

        {{ range .Users }}
            <div>
                <strong>{{ .Username }}</strong>
                <span>{{ .Role }}</span>

                {{ if .Disabled }}
                    <span>Disabled</span>
                {{ else }}
                    <span>Active</span>
                {{ end }}
            </div>
        {{ end }}
    </main>
</body>
</html>
