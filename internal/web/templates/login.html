<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login · SignalDock</title>

    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <span class="brand">SignalDock</span>
            <span class="header-label">Endpoint monitoring</span>
        </div>
    </header>

    <main class="container">

        <section>
            <h1>Sign in</h1>
            <p>Sign in to manage and monitor SignalDock.</p>

            {{ if .Error }}
                <div class="alert" role="alert">
                    {{ .Error }}
                </div>
            {{ end }}

            <form method="POST" action="/login">
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ .CSRFToken }}"
                >

                <div class="form-field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit">
                    Sign in
                </button>
            </form>
        </section>

    </main>

</body>

</html>
