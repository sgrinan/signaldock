services:
  signaldock:
    build:
      context: .
      dockerfile: Dockerfile
    image: signaldock:dev
    environment:
      SIGNALDOCK_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      SIGNALDOCK_ADMIN_USERNAME: ${SIGNALDOCK_ADMIN_USERNAME}
      SIGNALDOCK_ADMIN_PASSWORD: ${SIGNALDOCK_ADMIN_PASSWORD}
      SIGNALDOCK_GRAFANA_URL: http://grafana:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
        
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  blackbox:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    command:
      - --config.file=/config/blackbox.yml
    volumes:
      - ./config/blackbox/blackbox.yml:/config/blackbox.yml:ro

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      - blackbox
      - signaldock

  grafana:
    image: grafana/grafana:13.2.1
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "false"
      GF_SERVER_ROOT_URL: http://localhost:8080/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:v0.34.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

volumes:
  postgres-data:
  prometheus-data:
  grafana-data: