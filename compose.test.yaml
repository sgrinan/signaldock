name: signaldock-test

services:
  postgres-test:
    image: postgres:18.6
    environment:
      POSTGRES_DB: signaldock_test
      POSTGRES_USER: signaldock
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U signaldock -d signaldock_test
      interval: 2s
      timeout: 5s
      retries: 10