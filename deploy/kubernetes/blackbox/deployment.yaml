apiVersion: apps/v1
kind: Deployment

metadata:
  name: blackbox
  namespace: signaldock

spec:
  replicas: 1

  selector:
    matchLabels:
      app: blackbox

  template:
    metadata:
      labels:
        app: blackbox

    spec:
      containers:
        - name: blackbox
          image: quay.io/prometheus/blackbox-exporter:v0.28.0
          imagePullPolicy: IfNotPresent

          args:
            - --config.file=/config/blackbox.yml

          ports:
            - name: http
              containerPort: 9115

          volumeMounts:
            - name: config
              mountPath: /config/blackbox.yml
              subPath: blackbox.yml
              readOnly: true
              
      volumes:
        - name: config
          configMap:
            name: blackbox