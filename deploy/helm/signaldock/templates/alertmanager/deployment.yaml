apiVersion: apps/v1
kind: Deployment

metadata:
  name: alertmanager

spec:
  replicas: {{ .Values.alertmanager.replicaCount }}

  selector:
    matchLabels:
      app: alertmanager

  template:
    metadata:
      labels:
        app: alertmanager

    spec:
      containers:
        - name: alertmanager
          image: "{{ .Values.alertmanager.image.repository }}:{{ .Values.alertmanager.image.tag }}"
          imagePullPolicy: {{ .Values.alertmanager.image.pullPolicy }}

          args:
            - "--config.file={{ .Values.alertmanager.config.file }}"

          ports:
            - name: http
              containerPort: 9093

          volumeMounts:
            - name: config
              mountPath: {{ .Values.alertmanager.config.file }}
              subPath: alertmanager.yml
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: alertmanager-config