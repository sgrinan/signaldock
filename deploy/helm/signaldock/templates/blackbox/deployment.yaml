apiVersion: apps/v1
kind: Deployment

metadata:
  name: blackbox

spec:
  replicas: {{ .Values.blackbox.replicaCount }}

  selector:
    matchLabels:
      app: blackbox

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/blackbox/configmap.yaml") . | sha256sum }}
      
      labels:
        app: blackbox

    spec:
      containers:
        - name: blackbox
          image: "{{ .Values.blackbox.image.repository }}:{{ .Values.blackbox.image.tag }}"
          imagePullPolicy: {{ .Values.blackbox.image.pullPolicy }}

          args:
            - --config.file=/config/blackbox.yml

          ports:
            - name: http
              containerPort: 9115

          volumeMounts:
            - name: config
              mountPath: /config/blackbox.yml
              subPath: blackbox.yml
              readOnly: true
              
      volumes:
        - name: config
          configMap:
            name: blackbox