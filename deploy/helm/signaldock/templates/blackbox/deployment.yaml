apiVersion: apps/v1
kind: Deployment

metadata:
  name: blackbox

spec:
  replicas: {{ .Values.blackbox.replicaCount }}

  selector:
    matchLabels:
      app: blackbox

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/blackbox/configmap.yaml") . | sha256sum }}
      
      labels:
        app: blackbox

    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false

      containers:
        - name: blackbox
          image: "{{ .Values.blackbox.image.repository }}:{{ .Values.blackbox.image.tag }}"
          imagePullPolicy: {{ .Values.blackbox.image.pullPolicy }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            {{- toYaml .Values.blackbox.resources | nindent 12 }}

          args:
            - --config.file=/config/blackbox.yml

          ports:
            - name: http
              containerPort: 9115

          volumeMounts:
            - name: config
              mountPath: /config/blackbox.yml
              subPath: blackbox.yml
              readOnly: true
              
      volumes:
        - name: config
          configMap:
            name: blackbox