apiVersion: apps/v1
kind: Deployment

metadata:
  name: signaldock

spec:
  # Endpoint check state is process-local, so SignalDock is intentionally single-replica.
  replicas: 1

  selector:
    matchLabels:
      app: signaldock

  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/signaldock/configmap.yaml") . | sha256sum }}

      labels:
        app: signaldock

    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false

      containers:
        - name: signaldock
          image: {{ .Values.signaldock.image.repository }}:{{ .Values.signaldock.image.tag }}
          imagePullPolicy: {{ .Values.signaldock.image.pullPolicy }}

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            {{- toYaml .Values.signaldock.resources | nindent 12 }}

          ports:
            - name: http
              containerPort: 8080

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: POSTGRES_PASSWORD
            
            - name: SIGNALDOCK_DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"

            - name: SIGNALDOCK_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: signaldock
                  key: SIGNALDOCK_ADMIN_USERNAME

            - name: SIGNALDOCK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signaldock
                  key: SIGNALDOCK_ADMIN_PASSWORD

            - name: SIGNALDOCK_PORT
              valueFrom:
                configMapKeyRef:
                  name: signaldock
                  key: SIGNALDOCK_PORT

            - name: SIGNALDOCK_GRAFANA_URL
              valueFrom:
                configMapKeyRef:
                  name: signaldock
                  key: SIGNALDOCK_GRAFANA_URL