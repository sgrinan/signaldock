{{- if .Values.signaldock.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: signaldock
  {{- with .Values.signaldock.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.signaldock.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    {{- if .Values.signaldock.ingress.host }}
    - host: {{ .Values.signaldock.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signaldock
                port:
                  name: http
    {{- else }}
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: signaldock
                port:
                  name: http
    {{- end }}
{{- end }}
