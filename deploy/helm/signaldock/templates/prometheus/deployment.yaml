apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus

spec:
  replicas: {{ .Values.prometheus.replicaCount }}

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}

          args:
            - "--config.file={{ .Values.prometheus.config.file }}"
            - "--storage.tsdb.path={{ .Values.prometheus.dataPath }}"

          ports:
            - name: http
              containerPort: {{ .Values.prometheus.service.port }}

          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: {{ .Values.prometheus.config.file }}
              subPath: prometheus.yml
              readOnly: true

            - name: rules
              mountPath: {{ .Values.prometheus.config.rules }}
              readOnly: true

            - name: data
              mountPath: {{ .Values.prometheus.dataPath }}

      volumes:
        - name: config
          configMap:
            name: prometheus-config

        - name: rules
          configMap:
            name: prometheus-rules

        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data