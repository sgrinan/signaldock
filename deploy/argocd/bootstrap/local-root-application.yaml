apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signaldock-root-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sgrinan/signaldock.git
    targetRevision: main
    path: deploy/argocd/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
