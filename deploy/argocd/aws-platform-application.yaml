apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signaldock-platform-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sgrinan/signaldock.git
    targetRevision: main
    path: deploy/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
