apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signaldock-secrets-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sgrinan/signaldock.git
    targetRevision: main
    path: deploy/external-secrets/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: signaldock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true