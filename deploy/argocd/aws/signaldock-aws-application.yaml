apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signaldock-aws
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sgrinan/signaldock.git
    targetRevision: main
    path: deploy/helm/signaldock
    helm:
      valueFiles:
        - values-aws.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: signaldock
  syncPolicy:
    automated:
      prune: true
      selfHeal: true