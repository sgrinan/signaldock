apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signaldock
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sgrinan/signaldock.git
    targetRevision: main
    path: deploy/helm/signaldock
  destination:
    server: https://kubernetes.default.svc
    namespace: signaldock